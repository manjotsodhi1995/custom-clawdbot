services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-openclaw-custom:latest}
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Core settings (these override .env if set here)
      NODE_ENV: production
      HOME: /home/node
      TERM: xterm-256color

      # Gateway settings – these are passed via command line
      # You can remove them from here if they are only used in command
      OPENCLAW_GATEWAY_BIND: ${OPENCLAW_GATEWAY_BIND}
      OPENCLAW_GATEWAY_PORT: ${OPENCLAW_GATEWAY_PORT}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}

      # Optional: if your fork uses these
      GOG_KEYRING_PASSWORD: ${GOG_KEYRING_PASSWORD}
      XDG_CONFIG_HOME: /home/node/.openclaw

    volumes:
      - ${OPENCLAW_CONFIG_DIR:-/home/ubuntu/.openclaw}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-/home/ubuntu/.openclaw/workspace}:/home/node/.openclaw/workspace

    ports:
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"   # localhost only – very important for security

    # This is the correct way to write the command (array format, NO quotes around items)
    command:
      - node
      - dist/index.js
      - gateway
      - --bind
      - ${OPENCLAW_GATEWAY_BIND:-lan}
      - --port
      - ${OPENCLAW_GATEWAY_PORT:-18789}