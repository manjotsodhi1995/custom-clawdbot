version: '3.8'

services:
  clawdbot:
    build:
      context: .
      dockerfile: Dockerfile.lightweight
    container_name: clawdbot-gateway
    restart: unless-stopped
    ports:
      - "18789:18789"
    environment:
      - NODE_ENV=production
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN}
      - SIGNAL_ACCOUNT=${SIGNAL_ACCOUNT}
      - GATEWAY_PORT=18789
    volumes:
      - clawdbot-data:/home/clawdbot/.clawdbot
      - ./config:/app/config:ro
    networks:
      - clawdbot-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  clawdbot-data:
    driver: local

networks:
  clawdbot-net:
    driver: bridge
